<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0288d1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#01579b" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Savify Karaoke</title>
<script src="/static/boot.js"></script>
<link rel="stylesheet" href="/static/styles.css">
<link rel="icon" href="/static/icon.png">
<link rel="manifest" href="/manifest.webmanifest">
</head>
<body>
<div id="banner" class="banner" hidden></div>

<header class="appbar">
  <button id="btn-menu" class="menu-btn" aria-label="Menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 6h17M3.5 12h17M3.5 18h17"/></svg></button>
  <form id="search-form" class="search" autocomplete="off">
    <input id="q" type="search" inputmode="search" enterkeyhint="search" maxlength="200">
    <button id="q-clear" type="button" class="clear" aria-label="Clear" hidden>✕</button>
    <button id="q-mic" type="button" class="mic" aria-label="Voice search"></button>
  </form>
  <button id="btn-yt" class="chip" aria-label="Source">YT</button>
</header>

<nav class="tabs" role="tablist">
  <button id="tab-search" class="tab active" role="tab"></button>
  <button id="tab-queue" class="tab" role="tab"></button>
  <button id="tab-favs" class="tab" role="tab"></button>
</nav>

<main>
  <section id="view-search" class="view">
    <div id="recent-wrap" class="recent-wrap" hidden>
      <div id="recent" class="recent"></div>
      <button id="recent-toggle" class="recent-toggle" aria-label="History"></button>
    </div>
    <button id="filter-line" class="filter-line" hidden></button>
    <ul id="results" class="list"></ul>
    <div id="results-status" class="status"></div>
    <div id="sentinel"></div>
  </section>
  <section id="view-queue" class="view" hidden>
    <div id="next-line" class="next-line"></div>
    <div id="now-card" class="now-card" hidden></div>
    <ul id="queue-list" class="list"></ul>
    <div id="queue-empty" class="status"></div>
  </section>
  <section id="view-favs" class="view" hidden>
    <ul id="fav-list" class="list"></ul>
    <div id="fav-empty" class="status"></div>
  </section>
</main>

<div id="mini" class="mini" hidden>
  <div id="mini-title" class="mini-title"></div>
  <div class="mini-seek">
    <button id="mini-back" class="sk" aria-label="-10s">-10s</button>
    <span id="mini-pos" class="tm">0:00</span>
    <input id="mini-range" type="range" min="0" max="1000" value="0" aria-label="Seek">
    <span id="mini-dur" class="tm">0:00</span>
    <button id="mini-fwd" class="sk" aria-label="+10s">+10s</button>
  </div>
</div>

<footer class="transport">
  <div class="trow main">
    <button id="b-play" aria-label="Play/Pause"><span class="ic"></span><span class="lbl"></span></button>
    <button id="b-next" aria-label="Next"><span class="ic"></span><span class="lbl"></span></button>
    <button id="b-vdown" aria-label="Volume down"><span class="ic"></span><span class="lbl"></span></button>
    <button id="b-vup" aria-label="Volume up"><span class="ic"></span><span class="lbl"></span></button>
  </div>
  <div class="trow sec">
    <button id="b-replay" aria-label="Replay"><span class="ic"></span><span class="lbl"></span></button>
    <button id="b-mic" aria-label="Mic"><span class="ic"></span><span class="lbl"></span></button>
    <button id="b-react" aria-label="Reactions"><span class="ic"></span><span class="lbl"></span></button>
    <button id="b-add" aria-label="Add link"><span class="ic"></span><span class="lbl"></span></button>
  </div>
</footer>

<div id="pill" class="pill" hidden></div>
<div id="toast" class="toast" hidden></div>
<div id="live" class="sr" aria-live="polite"></div>

<div id="scrim" class="scrim" hidden></div>

<aside id="drawer" class="drawer" hidden>
  <h2 id="d-title"></h2>
  <div class="field"><span id="d-ui-l"></span><div id="d-ui" class="chips"></div></div>
  <label class="field"><span id="d-lang-l"></span>
    <select id="d-lang"><option value="vi">Tiếng Việt</option><option value="en">English</option></select>
  </label>
  <label class="field"><span id="d-dev-l"></span><input id="d-dev" maxlength="30"></label>
  <label class="field row"><input id="d-karaoke" type="checkbox"><span id="d-karaoke-l"></span></label>
  <label class="field"><span id="d-vol-l"></span><input id="d-vol" type="range" min="0" max="100"></label>
  <label class="field"><span id="d-res-l"></span>
    <select id="d-res"><option value="360">360p</option><option value="480">480p</option><option value="720">720p (HD)</option><option value="1080">1080p (Full HD)</option></select>
  </label>
  <div class="field"><span id="d-theme-l"></span><div id="d-theme" class="chips"></div></div>
  <div class="field" id="d-fs-field"><span id="d-fs-l"></span><div id="d-fs" class="chips"></div></div>
  <label class="field row"><input id="d-hc" type="checkbox"><span id="d-hc-l"></span></label>
  <div class="info" id="d-info"></div>
  <button id="d-reset" class="danger"></button>
  <button id="d-close" class="plain"></button>
  <div class="donate">
    <div id="donate-text" class="donate-text"></div>
    <img id="donate-qr" class="donate-qr" src="/static/qr-bank-small.png" alt="QR">
  </div>
</aside>

<div id="donate-big" class="donate-big" hidden>
  <img src="/static/qr-bank.png" alt="QR">
</div>

<div id="sheet-yt" class="sheet" hidden>
  <h3 id="y-title"></h3>
  <label class="field row"><input id="y-karaoke" type="checkbox"><span id="y-karaoke-l"></span></label>
  <div class="field"><span id="y-mode-l"></span><div id="y-modes" class="chips"></div></div>
  <div class="field"><span id="y-genre-l"></span><div id="y-genres" class="chips"></div></div>
  <button id="y-close" class="plain"></button>
</div>

<div id="sheet-add" class="sheet" hidden>
  <h3 id="a-title"></h3>
  <input id="a-url" inputmode="url" autocomplete="off">
  <input id="a-name" maxlength="200">
  <div class="btns"><button id="a-ok" class="primary"></button><button id="a-cancel" class="plain"></button></div>
</div>

<div id="sheet-react" class="sheet" hidden>
  <h3 id="r-title"></h3>
  <form id="r-msgform" class="msgbox" autocomplete="off">
    <input id="r-msg" maxlength="80" enterkeyhint="send" autocomplete="off" autocapitalize="sentences">
    <button id="r-send" type="submit" class="msgsend"></button>
  </form>
  <div id="r-quick" class="quick"></div>
  <div id="r-hint" class="r-hint"></div>
  <div id="r-grid"></div>
  <button id="r-close" class="plain"></button>
</div>

<div id="sheet-menu" class="sheet" hidden>
  <h3 id="m-title"></h3>
  <div id="m-items"></div>
  <button id="m-close" class="plain"></button>
</div>

<script src="/static/app.js"></script>
</body>
</html>
