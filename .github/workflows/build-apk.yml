name: Build APK

# Bấm Actions -> "Build APK" -> Run workflow để build.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Lay ma nguon
        uses: actions/checkout@v4

      - name: Cai Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cai Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Tao khoa ky APK neu thieu
        run: |
          if [ ! -f karaoke.jks ]; then
            keytool -genkeypair -keystore karaoke.jks -alias karaoke -keyalg RSA -keysize 2048 \
              -validity 36500 -storepass karaoke123 -keypass karaoke123 \
              -dname "CN=Savify Karaoke, O=Savify, C=VN"
          fi

      - name: Tang so phien ban (1.1, 1.2, 1.3...)
        id: ver
        run: |
          prev=$(cat version.txt 2>/dev/null | tr -dc '0-9')
          next=$(( ${prev:-0} + 1 ))
          echo "$next" > version.txt
          echo "minor=$next" >> "$GITHUB_OUTPUT"

      - name: Build APK
        run: gradle assembleRelease --no-daemon --stacktrace -PappMinor=${{ steps.ver.outputs.minor }}

      - name: Luu so phien ban vao kho (de lan build sau tang tiep)
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add version.txt
          git commit -m "Phien ban 1.${{ steps.ver.outputs.minor }}" || true
          git push origin HEAD:${{ github.ref_name }} || echo "Khong luu duoc version.txt"

      - name: Doi ten thanh karaoke.apk
        run: cp app/build/outputs/apk/release/app-release.apk karaoke.apk

      - name: Luu file APK (tai tu muc Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: karaoke-apk
          path: karaoke.apk

      - name: Tao ban phat hanh (tai truc tiep tu muc Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ steps.ver.outputs.minor }}
          name: Savify Karaoke v1.${{ steps.ver.outputs.minor }}
          body: Tai file karaoke.apk ben duoi, copy vao USB hoac gui sang TV de cai.
          files: karaoke.apk
